<title>Superflex Desk</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: sticky masthead (league picker + tabs) over one workspace; dense sortable tables with a heat scale where rank 1 = softest matchup. */
:root{
  --bg:#F2F4F0; --surface:#FFFFFF; --surface2:#E8ECE5; --ink:#15211A; --muted:#566559; --line:#D3DAD0;
  --accent:#1B6B47; --accent-ink:#FFFFFF; --soft:#2D6DB5; --tough:#C4622A; --warn:#8A5A0E;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#161F1A; --surface2:#202B24; --ink:#E6EEE8; --muted:#92A398; --line:#2A372F;
  --accent:#4FBF86; --accent-ink:#06130C; --soft:#5B9BE0; --tough:#E0864F; --warn:#E3B04B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161F1A; --surface2:#202B24; --ink:#E6EEE8; --muted:#92A398; --line:#2A372F;
  --accent:#4FBF86; --accent-ink:#06130C; --soft:#5B9BE0; --tough:#E0864F; --warn:#E3B04B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.mast{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;padding-block:12px 4px}
h1{font:700 26px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0}
.lg{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.lg label{font-size:11.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.lg select{max-width:100%}
.sub{color:var(--muted);font-size:12.5px;padding-bottom:4px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{flex:none;background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:600 14px var(--body);padding:9px 12px 8px;cursor:pointer}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
h2{font:600 20px/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0}
h3{font:600 13px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px;min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:6px 11px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input[type=search],select{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font:400 14px var(--body);min-width:0}
label.f{display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:7px 9px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:600 11.5px var(--body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:var(--surface2);position:sticky;top:0}
th.s{cursor:pointer}
th.s:hover{color:var(--ink)}
th[aria-sort]{color:var(--ink)}
td:first-child,th:first-child{text-align:left;position:sticky;left:0;z-index:2;background:var(--surface)}
th:first-child{background:var(--surface2);z-index:3}
tr:last-child td{border-bottom:0}
td.l,th.l{text-align:left}
td.c,th.c{text-align:center}
tr.sep td{border-top:2px solid var(--line)}
.nm{font-weight:600}
.tm{color:var(--muted);font-size:11.5px;margin-left:5px;font-weight:400}
.pos{display:inline-block;min-width:26px;text-align:center;font:600 11px var(--body);letter-spacing:.04em;padding:1px 4px;border-radius:3px;background:var(--surface2);color:var(--ink);margin-right:6px}
.slot{display:inline-block;min-width:44px;font:600 11.5px var(--body);letter-spacing:.05em;color:var(--muted)}
.mu{display:inline-flex;align-items:baseline;gap:5px;padding:2px 7px;border-radius:4px;font-size:12px;min-width:64px;justify-content:space-between;color:var(--ink)}
.mu i{font-style:normal;font-weight:500}.mu b{font-weight:600}
.mu.bye{background:var(--surface2);color:var(--muted);justify-content:center;font-weight:600;letter-spacing:.06em;font-size:11px}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:3px;border:1px solid var(--warn);color:var(--warn);margin-left:6px;letter-spacing:.02em;line-height:1.5}
.tag.bad{border-color:var(--tough);color:var(--tough)}
.tag.ok{border-color:var(--accent);color:var(--accent)}
.tag.mu{border-color:var(--line);color:var(--muted)}
.bar{display:inline-flex;align-items:center;gap:7px;width:100%;justify-content:flex-end}
.bar span.t{display:block;height:8px;border-radius:2px;background:var(--accent);min-width:1px}
.bar b{min-width:34px;text-align:right;font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:5px;font:600 12px var(--body);padding:3px 8px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.byegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.bw{border:1px solid var(--line);border-radius:6px;padding:9px 10px;min-width:0;background:var(--surface)}
.bw .w{font:600 12px var(--body);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.bw .n{font:700 26px/1.1 var(--display)}
.bw.hot{border-color:var(--tough)}
.bw .who{font-size:12.5px;color:var(--muted);min-height:2.6em}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px;margin-top:12px}
.kv>div{min-width:0}
.kv span{display:block;font-size:11.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.kv b{display:block;font:700 24px/1.15 var(--display);letter-spacing:.01em;overflow-wrap:anywhere}
.kv small{color:var(--muted);font-size:12.5px}
.spark{width:64px;height:22px;display:block}
.legend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend .ramp{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.legend .ramp span{width:22px;height:12px}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.calc{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:30px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border-radius:4px;padding:3px 4px 3px 8px;font-size:13px}
.chip button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 4px}
.verdict{font:600 20px/1.15 var(--display);letter-spacing:.02em;text-transform:uppercase}
.note{color:var(--muted);font-size:12.5px;max-width:78ch}
details.about{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
details.about summary{cursor:pointer;font-weight:600}
details.about p,details.about li{color:var(--muted);font-size:13px;max-width:80ch}
.empty{color:var(--muted);padding:12px 2px}
.ok{color:var(--accent);font-weight:600}
.bad{color:var(--tough);font-weight:600}
ul.alerts{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.alerts li{display:flex;gap:10px;align-items:baseline;min-width:0}
ul.alerts .sev{flex:none;min-width:52px;text-align:center;font:700 11px var(--body);letter-spacing:.07em;padding:1px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
ul.alerts .sev.fix{border-color:var(--tough);color:var(--tough)}
ul.alerts .sev.check{border-color:var(--warn);color:var(--warn)}
ul.alerts .sev.good{border-color:var(--accent);color:var(--accent)}
ul.alerts span.tx{min-width:0;overflow-wrap:anywhere}
.me td{font-weight:600}
.vt{display:inline-block;font-size:11px;font-weight:600;padding:0 5px;border-radius:3px;border:1px solid var(--line);margin-right:4px;line-height:1.55;color:var(--muted)}
.vt.s{border-color:var(--accent);color:var(--accent)}
.vt.x{border-color:var(--tough);color:var(--tough)}
a{color:var(--accent)}
.pbo{display:block;font-size:10px;line-height:1.15;color:var(--muted);font-weight:500}
.srcs{display:flex;flex-direction:column;gap:6px;margin:8px 0 0;padding:0;list-style:none}
.srcs li{display:flex;gap:8px;flex-wrap:wrap;align-items:baseline;min-width:0;font-size:13px}
.srcs .d{color:var(--muted);font-size:12px}
.srcs .w{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere;min-width:0}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1 = x => x == null || isNaN(x) ? '–' : Number(x).toFixed(1);
const f0 = x => x == null || isNaN(x) ? '–' : Math.round(x);
const pc = x => x == null || isNaN(x) ? '–' : Math.round(x) + '%';
const ord = n => { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); };
const POS = ['QB','RB','WR','TE'];
const CUR = D.cur;

/* ---------- league state ---------- */
let li = D.default;
try { const v = parseInt(localStorage.getItem('ff-league'), 10); if (v >= 0 && v < D.leagues.length) li = v; } catch (e) {}
const L = () => D.leagues[li];
const P = k => D.pl[k] || { name: k, pos: '?', team: null, next: [], wk: {} };
const EMPTYQ = { wk: {}, ppg: 0, l4: null, proj: 0, gp: 0, vorp: 0, val: 0 };
const Q = k => L().pts[k] || EMPTYQ;
const TM = rid => L().teams[rid];
const myTeam = () => TM(L().me);
const ownerName = k => { const r = L().own[k]; return r == null ? null : TM(r).mgr; };
const isMine = k => L().own[k] === L().me;
const leagueLabel = l => `${l.sf ? 'Superflex' : '1QB'} ${l.ppr === 1 ? 'PPR' : l.ppr === 0.5 ? 'Half PPR' : l.ppr === 0 ? 'Standard' : l.ppr + ' PPR'}`;

/* ---------- shared UI helpers ---------- */
const heat = r => {
  if (r == null) return '';
  const t = (16.5 - r) / 15.5, c = t >= 0 ? 'var(--soft)' : 'var(--tough)';
  return `background:color-mix(in srgb, ${c} ${Math.round(8 + Math.abs(t) * 44)}%, var(--surface))`;
};
const mu = (g, pos) => !g ? '<span class="mu bye">BYE</span>' :
  `<span class="mu" style="${heat(g.r)}" title="${g.home ? 'Home vs' : 'At'} ${esc(g.opp)}${g.r != null ? ': ' + ord(g.r) + ' softest ' + (pos === 'DEF' ? 'offense for a defense' : pos === 'K' ? 'scoring environment' : 'defense vs ' + pos) : ''}"><i>${g.home ? '' : '@'}${esc(g.opp)}</i><b>${g.r ?? ''}</b></span>`;
const posTag = p => `<span class="pos">${esc(p)}</span>`;
const ramp = () => `<div class="legend"><span>Tough</span><div class="ramp">${[32,26,20,16,12,6,1].map(r => `<span style="${heat(r)}"></span>`).join('')}</div><span>Soft</span><span>· number = defense rank, 1 = allows the most points</span></div>`;
const INJ = { Questionable: ['Q', ''], Doubtful: ['D', 'bad'], Out: ['OUT', 'bad'], IR: ['IR', 'bad'], PUP: ['PUP', 'bad'], NFI: ['NFI', 'bad'], Suspended: ['SUS', 'bad'], SUS: ['SUS', 'bad'], COV: ['COV', 'bad'], NA: ['NA', 'mu'], DNR: ['DNR', 'mu'] };
const injTag = k => { const p = P(k), i = p.inj; if (!i) return ''; const [t, c] = INJ[i] || [i, '']; return `<span class="tag ${c}" title="${esc(i + (p.body ? ' · ' + p.body : ''))} (Sleeper status)">${esc(t)}</span>`; };
const DEAD = ['Out','IR','PUP','NFI','Suspended','SUS','COV','NA','DNR'];
const fac = k => { const i = P(k).inj; return DEAD.includes(i) ? 0 : i === 'Doubtful' ? 0.5 : 1; };
const projWk = (k, wk = CUR) => { if (!k) return 0; const p = P(k); if (p.bye === wk) return 0; return Q(k).proj * fac(k); };
const trendTag = k => { const t = D.trend[k]; return t ? `<span class="tag ok" title="Among Sleeper's ${Object.keys(D.trend).length} most-added players in the last 48 hours">ADDS #${t.rank}</span>` : ''; };

function spark(wk, bye) {
  let s = '';
  for (let w = 1; w <= D.last; w++) {
    const v = wk[w], x = (w - 1) * 8;
    if (v == null) { if (w !== bye) s += `<rect x="${x}" y="19" width="6" height="2" fill="var(--line)"/>`; continue; }
    const h = Math.max(2, Math.min(22, Math.max(v, 0) / 35 * 22));
    s += `<rect x="${x}" y="${22 - h}" width="6" height="${h}" rx="1" fill="${w > D.last - 4 ? 'var(--accent)' : 'var(--muted)'}"/>`;
  }
  return `<svg class="spark" viewBox="0 0 ${D.last * 8} 22" role="img" aria-label="Weekly points, weeks 1 to ${D.last}: ${Object.entries(wk).map(([w, v]) => w + ': ' + v).join(', ')}">${s}</svg>`;
}

/* ---------- generic sortable table (st.sort 'none' keeps the given order) ---------- */
function table(cols, rows, st, onSort, rowKey) {
  const sorted = st.sort === 'none' ? [...rows] : [...rows].sort((a, b) => {
    const c = cols.find(c => c.k === st.sort) || cols[1];
    const va = c.v(a), vb = c.v(b);
    if (va == null && vb == null) return 0; if (va == null) return 1; if (vb == null) return -1;
    return (typeof va === 'string' ? va.localeCompare(vb) : va - vb) * (st.dir === 'asc' ? 1 : -1);
  });
  const th = cols.map(c => `<th class="${c.cls || ''} ${c.sortable === false ? '' : 's'}" data-k="${c.k}" ${st.sort === c.k ? `aria-sort="${st.dir === 'asc' ? 'ascending' : 'descending'}"` : ''} ${c.tip ? `title="${esc(c.tip)}"` : ''}>${c.label}${st.sort === c.k ? (st.dir === 'asc' ? ' ▲' : ' ▼') : ''}</th>`).join('');
  const body = sorted.map((r, i) => `<tr ${rowKey ? `data-id="${esc(rowKey(r))}"` : ''} ${r._cls ? `class="${r._cls}"` : ''}>${cols.map(c => `<td class="${c.cls || ''}" ${c.style ? `style="${c.style(r, sorted)}"` : ''}>${c.h(r, i)}</td>`).join('')}</tr>`).join('');
  const el = document.createElement('div');
  el.className = 'scroll';
  el.innerHTML = `<table><thead><tr>${th}</tr></thead><tbody>${body || `<tr><td class="empty" colspan="${cols.length}">No players match these filters.</td></tr>`}</tbody></table>`;
  el.querySelector('thead').addEventListener('click', e => {
    const t = e.target.closest('th.s'); if (!t) return;
    const k = t.dataset.k, c = cols.find(c => c.k === k);
    if (st.sort === k) st.dir = st.dir === 'asc' ? 'desc' : 'asc'; else { st.sort = k; st.dir = c.first || 'desc'; }
    onSort();
  });
  return el;
}
const pctShade = (vals, v) => { const s = vals.filter(x => x != null).sort((a, b) => a - b); if (v == null || s.length < 2) return ''; const r = s.filter(x => x < v).length / (s.length - 1); return `background:color-mix(in srgb, var(--accent) ${Math.round(Math.min(1, r) * 36)}%, transparent)`; };
function seg(opts, cur, on) {
  const el = document.createElement('div'); el.className = 'seg';
  el.innerHTML = opts.map(o => `<button type="button" data-v="${o.v}" aria-pressed="${o.v === cur}">${o.l}</button>`).join('');
  el.addEventListener('click', e => { const b = e.target.closest('button'); if (b) on(b.dataset.v); });
  return el;
}
function about(html) { const d = document.createElement('details'); d.className = 'about'; d.innerHTML = `<summary>How these numbers work</summary>${html}`; return d; }
function panel(html) { const d = document.createElement('div'); d.className = 'panel'; d.innerHTML = html; return d; }

/* ---------- lineups ---------- */
const ELIG = { QB: ['QB'], RB: ['RB'], WR: ['WR'], TE: ['TE'], K: ['K'], DEF: ['DEF'], FLEX: ['RB','WR','TE'], REC_FLEX: ['WR','TE'], WRRB_FLEX: ['RB','WR'], SUPER_FLEX: ['QB','RB','WR','TE'] };
const slotNames = () => L().slots.filter(s => s !== 'BN');
const slotLabel = s => s === 'SUPER_FLEX' ? 'SFLEX' : s === 'REC_FLEX' ? 'R-FLEX' : s === 'WRRB_FLEX' ? 'W/R' : s;
function optimal(team) {
  const slots = slotNames(), pool = team.players.filter(k => !team.ir.includes(k) && !(team.taxi || []).includes(k));
  const used = new Set(), out = new Array(slots.length).fill(null);
  const order = slots.map((s, i) => i).sort((a, b) => (ELIG[slots[a]] || []).length - (ELIG[slots[b]] || []).length);
  for (const i of order) {
    let best = null, bv = 0;
    for (const k of pool) { if (used.has(k) || !(ELIG[slots[i]] || []).includes(P(k).pos)) continue; const v = projWk(k); if (v > bv) { best = k; bv = v; } }
    if (best) { used.add(best); out[i] = best; }
  }
  return out;
}
const lineupTotal = a => a.reduce((s, k) => s + (k ? projWk(k) : 0), 0);
const oppFor = (rid, wk) => { const pr = (L().matchups[wk] || []).find(m => m.includes(rid)); return pr && pr.length === 2 ? pr.find(x => x !== rid) : null; };
const thu = k => { const n = P(k).next && P(k).next[0]; return n && n.day === '2026-11-05'; };

/* ====================== MY TEAM ====================== */
function viewTeam(root) {
  const Lg = L(), T = myTeam(), slots = slotNames();
  const oppId = oppFor(Lg.me, CUR), O = oppId != null ? TM(oppId) : null;
  const mine = T.starters, theirs = O ? O.starters : [];
  const myTot = lineupTotal(mine), opTot = lineupTotal(theirs), opt = optimal(T), optTot = lineupTotal(opt);
  const stand = Object.values(Lg.teams).sort((a, b) => b.w - a.w || b.pf - a.pf);
  const seed = stand.findIndex(t => t.rid === Lg.me) + 1;
  const pfRank = Object.values(Lg.teams).sort((a, b) => b.pf - a.pf).findIndex(t => t.rid === Lg.me) + 1;

  /* alerts */
  const al = [];
  slots.forEach((s, i) => {
    const k = mine[i];
    if (!k) {
      const fa = (ELIG[s] || []).map(p => Lg.streams.find(x => x.pos === p)).filter(Boolean).sort((a, b) => b.score - a.score)[0];
      al.push(['fix', `${slotLabel(s)} slot is empty.` + (opt[i] ? ` ${esc(P(opt[i]).name)} (${f1(projWk(opt[i]))} proj) is on your bench.` : fa ? ` No eligible player on your roster. Top free agent in Stream Finder: ${esc(fa.name)}.` : '')]); return; }
    const p = P(k), n = esc(p.name);
    if (p.bye === CUR) al.push(['fix', `${n} (${slotLabel(s)}) is on bye in Week ${CUR}.`]);
    else if (DEAD.includes(p.inj)) al.push(['fix', `${n} (${slotLabel(s)}) is listed ${esc(p.inj)}${p.body ? ' (' + esc(p.body) + ')' : ''}.`]);
    else if (p.inj === 'Doubtful') al.push(['check', `${n} (${slotLabel(s)}) is listed Doubtful.`]);
    else if (p.inj === 'Questionable') al.push(['check', `${n} (${slotLabel(s)}) is listed Questionable${p.body ? ' (' + esc(p.body) + ')' : ''}.`]);
    if (thu(k)) al.push(['note', `${n} plays Thursday night, so that spot locks at kickoff.`]);
  });
  const curSet = new Set(mine.filter(Boolean)), optSet = new Set(opt.filter(Boolean));
  const ins = [...optSet].filter(k => !curSet.has(k)), outs = [...curSet].filter(k => !optSet.has(k));
  if (ins.length && outs.length && optTot - myTot >= 0.5) al.push(['check', `Projection favors starting ${ins.map(k => `${esc(P(k).name)} (${f1(projWk(k))})`).join(', ')} over ${outs.length ? outs.map(k => `${esc(P(k).name)} (${f1(projWk(k))})`).join(', ') : 'an empty slot'}, about +${f1(optTot - myTot)} points.`]);
  else if (!al.some(a => a[0] === 'fix')) al.push(['good', 'Your lineup matches the projection-optimal lineup.']);

  const head = panel(`<h2>${esc(Lg.name)}</h2>
    <p class="note" style="margin:4px 0 0">${esc(T.mgr)} · ${leagueLabel(Lg)} · ${Lg.size} teams</p>
    <div class="kv">
      <div><span>Record</span><b>${T.w}-${T.l}${T.t ? '-' + T.t : ''}</b><small>${ord(seed)} of ${Lg.size} · ${f1(T.pf)} PF (${ord(pfRank)})</small></div>
      <div><span>Week ${CUR} opponent</span><b>${O ? esc(O.mgr) : 'No game'}</b><small>${O ? `${O.w}-${O.l}${O.t ? '-' + O.t : ''} · ${f1(O.pf)} PF` : ''}</small></div>
      <div><span>Projected, your lineup</span><b>${f1(myTot)}</b><small>${O ? 'Opponent ' + f1(opTot) + (optimal(O).filter(Boolean).length > O.starters.filter(Boolean).length || lineupTotal(optimal(O)) - opTot >= 1 ? ` as set, ${f1(lineupTotal(optimal(O)))} at best` : '') : ''}</small></div>
      <div><span>Projected, best lineup</span><b>${f1(optTot)}</b><small>${optTot - myTot >= 0.5 ? '+' + f1(optTot - myTot) + ' available' : 'Already optimal'}</small></div>
    </div>
    <h3 style="margin-top:14px">Lineup check</h3>
    <ul class="alerts">${al.map(([s, t]) => `<li><span class="sev ${s}">${{ fix: 'FIX', check: 'CHECK', note: 'NOTE', good: 'OK' }[s]}</span><span class="tx">${t}</span></li>`).join('')}</ul>`);
  root.append(head);

  /* matchup table */
  const row = (k) => k ? `${injTag(k)}` : '';
